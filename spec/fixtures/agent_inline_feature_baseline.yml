# AI 助手「这个功能在哪」的覆盖基线。
#
# 这里列的是**界面上存在、但还没写进 Crm::Agent::SystemMap 的按钮**。
# 存量 144 条是 2026-10-29 建闸时一次性收下的，不代表它们不该文档化——
# 只是不能为了建闸把它们全写完。
#
# 规矩（见 spec/services/crm/agent/inline_feature_coverage_spec.rb）：
#   新加的按钮文案**不许直接进这个文件**。先问一句「用户会不会问『XX 在哪』」：
#     会  → 写进 SystemMap 的 INLINE（连路径和限制一起写），这里不用加
#     不会（纯行内操作、弹窗里的按钮、一次性动作）→ 才加到这里，并在行尾写明理由
#
# 清掉存量：每次动到某个页面，顺手把那一页的几条要么文档化、要么标注理由。
