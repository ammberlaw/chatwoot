services:
  base: &base
    image: wintouch-crm:prod
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    volumes:
      - storage_data:/app/storage

  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    ports:
      # nginx 前置 80/443（域名 wintouchspace.com + 证书），rails 只对本机暴露
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data

  # 文档转 PDF sidecar（LibreOffice）：按供应商导出采购单 PDF 用（Mes::GotenbergClient）。
  # 仅内网可达（不暴露端口），rails/sidekiq 通过服务名 http://gotenberg:3000 调用。
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: always
    command:
      - gotenberg
      - --api-timeout=60s

volumes:
  storage_data:
  postgres_data:
  redis_data:
