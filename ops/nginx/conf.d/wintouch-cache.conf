# Wintouch-CRM 静态资源缓存层（gzip on 已在主配置开启，这里只补参数）
proxy_cache_path /var/cache/nginx/wintouch levels=1:2 keys_zone=wintouch_static:20m max_size=2g inactive=30d use_temp_path=off;

gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/javascript text/css text/plain application/javascript application/json application/xml image/svg+xml font/woff2 font/woff application/vnd.ms-fontobject;
